[package]
name = "pfsense-mssql-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
eframe = "0.29"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "tokio"] }
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
