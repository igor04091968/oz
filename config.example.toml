[runtime]
interval_seconds = 60
audit_db_path = "audit.sqlite3"

[mssql]
connection_string_env = "MSSQL_CONNECTION_STRING"
default_connection_string = "server=tcp:srv-db,1433;database=rd_all;TrustServerCertificate=true"

[requests]
query_file = "sql/remote_work_requests.sql"
mark_unapproved_as_seen = false
poll_lookback_days = 30
# Name fragments, OR within the list; empty means any recipient.
included_recipients = []
excluded_authors = []
# Employees (name fragments) who must approve first; empty = notify immediately.
preapproval_employees = []
# One flow name per item (potok.name). Add custom flows if needed.
tracked_flows = [
  "Заявки на удаленную работу",
  "Служебные записки",
  "Запросы на права",
  "Согласие на работу в выходные дни",
]
# Uncomment to limit selected flows to one docum.id_filial; omit for all branches.
# branch_id = 1

[pfsense]
base_url = "https://10.35.0.1"
api_key_env = "OZ_PFSENSE_API_KEY"
timeout_seconds = 60
rules_interface = "openvpn"
ca_cert_path = ""
skip_tls_verify = false
