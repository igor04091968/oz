[runtime]
interval_seconds = 60
audit_db_path = "audit.sqlite3"

[mssql]
connection_string_env = "MSSQL_CONNECTION_STRING"
default_connection_string = "server=tcp:srv-db,1433;database=rd_all;TrustServerCertificate=true"
query = """
select
  rule_key,
  action,
  method,
  path,
  body_json,
  desired_hash
from dbo.PfsenseDesiredState
where enabled = 1
order by rule_key
"""

# The current source query for remote-work requests is documented separately:
# sql/remote_work_requests.sql

[requests]
query_file = "sql/remote_work_requests.sql"
mapping_file = "workstations.example.toml"
rdp_port = 3389
mark_unapproved_as_seen = false

[pfsense]
base_url = "https://pfsense.example.local/api/v2"
token_env = "PFSENSE_API_TOKEN"
insecure_tls = false
timeout_seconds = 15

[pfsense.remote_work_access]
method = "POST"
path = "/firewall/rule"
body_template = """
{
  "type": "pass",
  "interface": "openvpn",
  "ipprotocol": "inet",
  "protocol": "tcp",
  "source": "{{vpn_user}}",
  "destination": "{{workstation_host}}",
  "destination_port": "{{rdp_port}}",
  "descr": "remote-work {{request_num}} {{requester}} {{date_n}} {{time_n}}"
}
"""
